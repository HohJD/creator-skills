name: A skill gave a wrong or unsafe answer
description: Invented facts, a dropped qualifier, the wrong skill firing, a broken file.
labels: ["bug"]
body:
  - type: input
    id: skill
    attributes:
      label: Skill
      placeholder: subtitle-editor
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Agent and version
      placeholder: Claude Code 2.1.331 / Codex CLI 0.172.0
    validations:
      required: true
  - type: textarea
    id: prompt
    attributes:
      label: What you asked
      description: Replace anything private with invented text.
    validations:
      required: true
  - type: textarea
    id: got
    attributes:
      label: What came back, and what was wrong with it
    validations:
      required: true
  - type: textarea
    id: lint
    attributes:
      label: creator-lint output
      description: If the output is a file or text the linter reads, paste `python3 tools/creator_lint.py <file>`.
      render: text
